version: 2
updates:
  # 1. Configuration for Node.js (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"          # Runs on the first Monday of the month
      time: "09:00"          # Runs at 9:00 AM UTC

  # 2. Configuration for PHP (Composer)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"          # Keeps them synced on the same day
      time: "09:00"
